<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binita's Wish Well - Admin Dashboard 🔐</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap"
    rel="stylesheet" />
  <style>
    /* ════════════════════════════════════════════
       RESET & BASE (consistent with index.html)
    ════════════════════════════════════════════ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --pink: #ff6eb4;
      --pink-deep: #e91e8c;
      --lavender: #c9a7f5;
      --pink-light: #ffb3d9;
      --dark-purple: #4a2845;
      --shadow: rgba(255, 110, 180, 0.25);
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: url('image/admin_bg.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      color: #5b2a4a;
      overflow-x: hidden;
    }

    /* ════════════════════════════════════════════
       LOCK SCREEN
    ════════════════════════════════════════════ */
    .lock-screen {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4); /* Make it semi-transparent so the new background shows */
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .lock-card {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 40px 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(255, 110, 180, 0.25), 0 0 0 2px rgba(255, 182, 213, 0.5);
      text-align: center;
    }

    .lock-icon {
      font-size: 3rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }
    }

    .lock-title {
      font-family: 'Pacifico', cursive;
      font-size: 1.8rem;
      color: var(--pink-deep);
      margin-bottom: 8px;
    }

    .lock-desc {
      font-size: 0.9rem;
      color: #9b6ee0;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .input-field {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #ffb3d9;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.9);
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      color: #5b2a4a;
      outline: none;
      font-weight: 600;
      margin-bottom: 18px;
      transition: border-color 0.3s, box-shadow 0.3s;
      text-align: center;
    }

    .input-field:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 4px rgba(255, 110, 180, 0.18);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff6eb4 0%, #e91e8c 100%);
      color: white;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(233, 30, 140, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(233, 30, 140, 0.45);
    }

    .error-msg {
      color: #c0306a;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 10px;
      display: none;
    }

    /* ════════════════════════════════════════════
       MAIN DASHBOARD LAYOUT
    ════════════════════════════════════════════ */
    .dashboard {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      display: none;
      /* Shown after unlock */
    }

    .header-banner {
      background: linear-gradient(135deg, #ff6eb4 0%, #e91e8c 50%, #c9a7f5 100%);
      border-radius: 24px;
      padding: 30px 40px;
      color: white;
      box-shadow: 0 10px 32px var(--shadow);
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header-info h1 {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      margin-bottom: 5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.15);
    }

    .header-info p {
      font-weight: 600;
      opacity: 0.95;
    }

    .btn-logout {
      padding: 10px 22px;
      background: rgba(255, 255, 255, 0.2);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      border-radius: 30px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(255, 110, 180, 0.1);
      border: 1px solid rgba(255, 182, 213, 0.4);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stat-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #9b6ee0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-val {
      font-size: 2.2rem;
      font-weight: 900;
      color: #5b2a4a;
    }

    /* Config Panel */
    .config-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(255, 110, 180, 0.15);
      border: 1px solid rgba(255, 182, 213, 0.4);
      margin-bottom: 40px;
    }

    .card-title-sec {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--pink-deep);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-form {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .config-form .input-field {
      flex: 1;
      min-width: 280px;
      margin-bottom: 0;
      text-align: left;
    }

    .config-form button {
      padding: 14px 28px;
    }

    /* Toolbar Controls */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-filter {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex: 1;
      max-width: 600px;
    }

    .search-filter .input-field {
      margin-bottom: 0;
      text-align: left;
      flex: 1;
      min-width: 200px;
    }

    .btn-action {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #c9a7f5, #9b6ee0);
      color: white;
      box-shadow: 0 4px 14px rgba(155, 110, 224, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #d3b7f8, #a87fe7);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: white;
      border: 1.5px solid #ffb3d9;
      color: var(--pink-deep);
    }

    .btn-secondary:hover {
      background: #fff0f6;
      transform: translateY(-2px);
    }

    /* Wish Grid / Card Display */
    .wishes-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
      min-height: 200px;
    }

    .wish-item-card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(255, 110, 180, 0.08);
      border-left: 5px solid var(--pink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      animation: cardFade 0.5s ease-out;
    }

    @keyframes cardFade {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .wish-item-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(255, 110, 180, 0.15);
    }

    .wish-item-card.unread {
      border-left-color: var(--pink-deep);
      background: linear-gradient(145deg, #ffffff, #fffdfb);
    }

    .wish-text {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.6;
      color: #5b2a4a;
      white-space: pre-wrap;
    }

    .wish-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px dashed rgba(255, 110, 180, 0.2);
      padding-top: 12px;
      font-size: 0.8rem;
      color: #a0608a;
      font-weight: 700;
    }

    .wish-date {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .wish-status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .badge-unread {
      background: #ffe4f0;
      color: #c0306a;
      border: 1px solid #ffb3d9;
    }

    .badge-read {
      background: #e8fce8;
      color: #2a7a2a;
      border: 1px solid #8fdb8f;
    }

    /* Loading States */
    .loader-wrap {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 0;
      color: #9b6ee0;
      font-weight: 700;
      gap: 15px;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid rgba(155, 110, 224, 0.15);
      border-top-color: #9b6ee0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: #a0608a;
      font-weight: 700;
    }

    .empty-icon {
      font-size: 3.5rem;
      margin-bottom: 12px;
      display: block;
    }
  </style>
</head>

<body>

  <!-- LOCK SCREEN LOGIN -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <span class="lock-icon">🗝️</span>
      <h2 class="lock-title">Admin Gate</h2>
      <p class="lock-desc">Enter authorization password to view wishes</p>
      <form onsubmit="handleLogin(event)">
        <input type="password" id="adminPassword" class="input-field" placeholder="Admin password..." required
          autocomplete="off" />
        <button type="submit" class="btn-submit">Unlock Dashboard 🔓</button>
      </form>
      <div class="error-msg" id="loginError">❌ Incorrect password. Try again!</div>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <!-- Top banner -->
    <header class="header-banner">
      <div class="header-info">
        <h1>Admin Control Panel 🌸</h1>
        <p>Binita's Magic Wishing Well Database Manager</p>
      </div>
      <button class="btn-logout" onclick="handleLogout()">Lock Portal 🔒</button>
    </header>

    <!-- Stats summary -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-title">Total Wishes Saved</span>
        <span class="stat-val" id="statTotal">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">Unread Wishes</span>
        <span class="stat-val" id="statUnread">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">Last Wish Added</span>
        <span class="stat-val" id="statLast"
          style="font-size: 1rem; font-weight: 700; margin-top: 10px; line-height: 1.4;">Never</span>
      </div>
    </div>

    <!-- Script Configuration Panel -->
    <div class="config-card">
      <h3 class="card-title-sec">⚙️ Config Google Sheets Web App Connection</h3>
      <form class="config-form" onsubmit="saveConfig(event)">
        <input type="url" id="scriptUrlInput" class="input-field"
          placeholder="Paste Google Apps Script Web App URL here..." required />
        <button type="submit" class="btn-submit" style="width: auto;">Save Link 🔗</button>
      </form>
    </div>

    <!-- Filters & Actions -->
    <div class="toolbar">
      <div class="search-filter">
        <input type="text" id="searchInput" class="input-field" placeholder="🔍 Search wishes..."
          oninput="filterWishes()" />
      </div>
      <div style="display: flex; gap: 10px;">
        <button class="btn-action btn-secondary" onclick="exportCSV()">📤 Export CSV</button>
        <button class="btn-action btn-primary" onclick="loadWishes()">🔄 Refresh Data</button>
      </div>
    </div>

    <!-- Wishes Card Grid -->
    <div class="wishes-container" id="wishesContainer">
      <!-- Loaded dynamically -->
    </div>

  </div>

  <script>
    // ════════════════════════════════════════════
    // CONFIGURATION & GLOBAL STATE
    // ════════════════════════════════════════════
    const ADMIN_PASS = 'admin123'; // Default password
    let APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzQtCgasuRkI22_yIl_84ZqtrP0T_pdfiwaDIGi9BnmNZNnuL2QR-7KU9LGJUOURUl7/exec';      // Configured script URL
    let allWishes = [];

    // On Load
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Check if logged in in session
      if (sessionStorage.getItem('adminAuth') === 'true') {
        unlockDashboard();
      }

      // 2. Load configured Script URL from LocalStorage (with account session stripping)
      let savedUrl = localStorage.getItem('appsScriptUrl');
      if (savedUrl) {
        savedUrl = savedUrl.replace(/\/u\/\d+\//, '/');
        APPS_SCRIPT_URL = savedUrl;
        document.getElementById('scriptUrlInput').value = savedUrl;
      } else if (APPS_SCRIPT_URL) {
        APPS_SCRIPT_URL = APPS_SCRIPT_URL.replace(/\/u\/\d+\//, '/');
        document.getElementById('scriptUrlInput').value = APPS_SCRIPT_URL;
      }
    });

    // Login logic
    function handleLogin(event) {
      event.preventDefault();
      const pwd = document.getElementById('adminPassword').value;
      const errorEl = document.getElementById('loginError');

      if (pwd === ADMIN_PASS) {
        sessionStorage.setItem('adminAuth', 'true');
        unlockDashboard();
        errorEl.style.display = 'none';
        document.getElementById('adminPassword').value = '';
      } else {
        errorEl.style.display = 'block';
        document.getElementById('adminPassword').value = '';
      }
    }

    function unlockDashboard() {
      document.getElementById('lockScreen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        if (APPS_SCRIPT_URL) {
          loadWishes();
        } else {
          showEmptyState('Please configure your Google Sheets Web App Connection URL above to load wishes!');
        }
      }, 500);
    }

    function handleLogout() {
      sessionStorage.removeItem('adminAuth');
      location.reload();
    }

    // Save script URL configuration (with account session stripping)
    function saveConfig(event) {
      event.preventDefault();
      let url = document.getElementById('scriptUrlInput').value.trim();
      url = url.replace(/\/u\/\d+\//, '/'); // Clean account identifiers like /u/2/
      document.getElementById('scriptUrlInput').value = url;
      localStorage.setItem('appsScriptUrl', url);
      APPS_SCRIPT_URL = url;
      alert('✅ Connection URL saved successfully!');
      loadWishes();
    }

    // Load wishes from Google Sheet (using JSONP to completely bypass CORS in local files)
    function loadWishes() {
      if (!APPS_SCRIPT_URL) {
        showEmptyState('Please configure your Google Sheets Web App Connection URL first!');
        return;
      }

      showLoading();

      // Create a unique callback name
      const callbackName = 'wishes_callback_' + Math.floor(Math.random() * 1000000);
      
      // Define the callback function globally so Apps Script can call it
      window[callbackName] = function(result) {
        // Cleanup script tag and global callback
        const scriptTag = document.getElementById(scriptId);
        if (scriptTag) scriptTag.remove();
        delete window[callbackName];
        
        if (result.status === 'success') {
          // Sort wishes so newest is first
          allWishes = result.wishes.reverse();
          renderWishes(allWishes);
          updateStats(allWishes);
        } else {
          showEmptyState('API Error: ' + (result.message || 'Unknown response structure'));
        }
      };

      // Create dynamic script tag to fetch data safely across origins
      const scriptId = 'jsonp_script_' + Math.floor(Math.random() * 1000000);
      const script = document.createElement('script');
      script.id = scriptId;
      
      const sep = APPS_SCRIPT_URL.includes('?') ? '&' : '?';
      script.src = `${APPS_SCRIPT_URL}${sep}prefix=${callbackName}&_=${new Date().getTime()}`;
      
      // Handle network errors
      script.onerror = function() {
        const scriptTag = document.getElementById(scriptId);
        if (scriptTag) scriptTag.remove();
        delete window[callbackName];
        showEmptyState(`
          <div style="text-align: left; max-width: 500px; margin: 20px auto; line-height: 1.6; font-family: 'Nunito', sans-serif;">
            <p style="color: #c0306a; font-weight: 800; margin-bottom: 10px; font-size: 1.15rem;">⚠️ Connection Failed</p>
            <p style="margin-bottom: 8px;">Could not load database from URL: <br><code style="word-break: break-all; background: #fff0f5; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; display: block; margin-top: 5px; border: 1px solid #ffb3d9;">${APPS_SCRIPT_URL}</code></p>
            <p style="margin-top: 12px; font-weight: 700; color: #7b3f6e;">Please verify the following:</p>
            <ul style="margin-left: 20px; margin-top: 5px; list-style-type: disc;">
              <li>Did you save the <strong>new</strong> URL inside the configuration box above?</li>
              <li>Is your Apps Script deployed with <strong>"Who has access: Anyone"</strong>?</li>
              <li>Are you connected to the internet?</li>
            </ul>
          </div>
        `);
      };

      document.body.appendChild(script);
    }

    // Render HTML Cards for wishes
    function renderWishes(wishes) {
      const container = document.getElementById('wishesContainer');
      container.innerHTML = '';

      if (wishes.length === 0) {
        showEmptyState('No wishes found in database.');
        return;
      }

      wishes.forEach(item => {
        const dateStr = new Date(item.timestamp).toLocaleString();
        const card = document.createElement('div');
        card.className = `wish-item-card ${item.status === 'Unread' ? 'unread' : ''}`;

        card.innerHTML = `
          <div class="wish-text">${escapeHTML(item.wish)}</div>
          <div class="wish-meta">
            <div class="wish-date">📅 ${dateStr}</div>
            <div class="wish-status-badge ${item.status === 'Unread' ? 'badge-unread' : 'badge-read'}">
              ${item.status}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Search and Filter wishes
    function filterWishes() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allWishes.filter(item =>
        item.wish.toLowerCase().includes(query)
      );
      renderWishes(filtered);
    }

    // Stats calculation
    function updateStats(wishes) {
      document.getElementById('statTotal').textContent = wishes.length;
      const unreadCount = wishes.filter(item => item.status === 'Unread').length;
      document.getElementById('statUnread').textContent = unreadCount;

      if (wishes.length > 0) {
        const lastDate = new Date(wishes[0].timestamp).toLocaleString();
        document.getElementById('statLast').textContent = lastDate;
      } else {
        document.getElementById('statLast').textContent = 'Never';
      }
    }

    // UI State Helpers
    function showLoading() {
      const container = document.getElementById('wishesContainer');
      container.innerHTML = `
        <div class="loader-wrap">
          <div class="spinner"></div>
          <div>Syncing wishing well database...</div>
        </div>
      `;
    }

    function showEmptyState(message) {
      const container = document.getElementById('wishesContainer');
      container.innerHTML = `
        <div class="empty-state">
          <span class="empty-icon">✨</span>
          <div>${message}</div>
        </div>
      `;
    }

    // Export CSV functionality
    function exportCSV() {
      if (allWishes.length === 0) {
        alert('No data available to export.');
        return;
      }

      let csvContent = 'data:text/csv;charset=utf-8,Timestamp,Wish,Status\n';

      allWishes.forEach(item => {
        const cleanWish = item.wish.replace(/"/g, '""'); // Escape double quotes
        csvContent += `"${new Date(item.timestamp).toLocaleString()}","${cleanWish}","${item.status}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `Wishes_Backup_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Helpers
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g,
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>

</html>
